<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Agreement of each teacher with Sonnet 5.5</title>
<desc id="d">Tier-2 Jaccard with Sonnet 5.5: Opus 5.5 0.70 (95% interval 0.63 to 0.78, 100 pages); Gemini 4 Argon 0.68 (95% interval 0.61 to 0.75, 100 pages); Gemma 4 12B 0.42 (95% interval 0.38 to 0.47, 300 holdout pages). Sonnet against its own rerun: 0.79 (0.72 to 0.86).</desc>
<style>
  .ink { fill: #0b0b0b; } .muted, .tick { fill: #52514e; } .tick { font-size: 12px; }
  .grid { stroke: #e4e3df; stroke-width: 1; } .band { fill: #e4e3df; } .bandline { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .s1 { fill: #2a78d6; } .s1l { stroke: #2a78d6; } .s2 { fill: #eb6834; }
  .ring { stroke: #fcfcfb; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #f0efec; } .muted, .tick { fill: #c3c2b7; } .grid { stroke: #2e2e2c; } .band { fill: #2e2e2c; } .bandline { stroke: #8a8984; }
    .s1 { fill: #3987e5; } .s1l { stroke: #3987e5; } .s2 { fill: #d95926; } .ring { stroke: #1a1a19; }
  }
</style>
