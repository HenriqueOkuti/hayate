# Human-checked gold sample v0 (#5, decision 0010).
# Used by scripts/review_gold.py and scripts/gold_report.py.

[sample]
labels_dir = "data/labels"
teacher_run = "holdout-v2"  # Sonnet 5.5, prompt v2, 300 pages on domains the prompt was not tuned on
# Pages the run labeled twice (its repeat pass) are reviewed blind; the rest show the teacher's labels.
order_seed = 5  # review order: seeded hash of the page id, so blind and assisted pages are mixed
more_chars = 20000  # extracted text shown beyond what the teacher saw, behind a fold

[output]
dir = "data/gold/v0"  # tasks.jsonl (page text), reviews.jsonl (the decisions), run.json; never committed

[server]
host = "127.0.0.1"
port = 8765

[report]
# Other label runs on the same pages, scored against the blind answers only (see the decision).
compare_runs = ["holdout-v0", "holdout-gemma-v2", "holdout-v2-resiliparse"]
